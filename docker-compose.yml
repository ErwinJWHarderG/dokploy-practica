
version: "3.8"

services:
  app:
    image: node:20-alpine
    container_name: compose-webapp-quindio
    working_dir: /app
    command:
      - node
      - -e
      - |
        const http = require('http');
        const server = http.createServer((req, res) => {
          res.writeHead(200, {'Content-Type': 'text/html; charset=utf-8'});
          res.end('<h1>Docker Compose - Universidad del Quindío</h1><p>Servicio funcionando correctamente.</p>');
        });
        server.listen(3000, '0.0.0.0', () => console.log('Servidor iniciado en el puerto 3000'));
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
    restart: unless-stopped
